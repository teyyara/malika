name: Validate Malika

on:
  push:
    branches: ["aeos/progression", "main"]
  pull_request:
    branches: ["main", "aeos/progression"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run game-state tests
        run: npm test
      - name: Build production assets
        run: npm run build
