name: Validate Malika

on:
  push:
    branches: ["aeos/progression", "main"]
  pull_request:
    branches: ["main", "aeos/progression"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run game-state and content tests
        run: npm test
      - name: Build production assets
        run: npm run build
      - name: Install Chromium and operating-system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run production browser journeys
        run: npm run test:e2e
      - name: Upload browser test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Upload rendered visual review screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rendered-visual-review
          path: test-results/screenshots/
          if-no-files-found: warn
          retention-days: 14
